<!DOCTYPE html>
<html>
<head>
    <title>Malaria Detection</title>
</head>
<body>
    <h1>Malaria Detection</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="image" accept="image/*">
        <button type="submit">Analyze Scan</button>
    </form>

    {% if predicted_class %}
        <p>Result: {{ predicted_class }}</p>
        {% if image_url %}
            <img src="{{ image_url }}" alt="Uploaded Image" style="max-width: 300px;">
        {% endif %}
    {% endif %}
</body>
</html>
